<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap");

/* Amornphan POS — component styles. Every value is a token from tokens.json. */
body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink); font-size: 16px; line-height: 26px; -webkit-font-smoothing: antialiased; }
.ap-num { font-variant-numeric: tabular-nums lining-nums; }
.ap-stage { padding: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-start; }
.ap-col { display: flex; flex-direction: column; gap: var(--space-3); }
.ap-cap { font-size: 14px; line-height: 22px; color: var(--ink-muted); }
.ap-kbd { font-family: var(--font-mono); font-size: 12px; line-height: 18px; font-weight: 500; padding: 0 var(--space-1); border-radius: var(--radius-sm); border: 1px solid currentColor; opacity: .85; }
.ap-icon { flex: none; display: inline-block; vertical-align: middle; }

/* focus — one ring everywhere: paper gap then a solid ring */
.ap-focusable:focus-visible, .ap-btn:focus-visible, .ap-chip:focus-visible, .ap-step-btn:focus-visible, .ap-search input:focus-visible, .ap-card:focus-visible, .ap-seg button:focus-visible, .ap-pin-key:focus-visible, .ap-lang button:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

/* Button */
.ap-btn { font: inherit; font-size: 16px; line-height: 24px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--target-min); min-width: var(--target-min); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; text-align: center; white-space: nowrap; transition: transform .06s ease; }
.ap-btn:active { transform: translateY(1px); }
.ap-btn[disabled] { cursor: not-allowed; opacity: .45; }
.ap-btn-block { display: flex; width: 100%; }
.ap-btn-lg { min-height: var(--target-lg); font-size: 18px; padding: 0 var(--space-5); }
.ap-btn-xl { min-height: var(--target-pay); font-size: 22px; padding: 0 var(--space-5); border-radius: var(--radius-lg); }
.ap-btn-primary { background: var(--brand); color: var(--on-brand); }
.ap-btn-pay { background: var(--accent); color: var(--on-accent); border-color: var(--accent-edge); }
.ap-btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.ap-btn-ghost { background: transparent; color: var(--brand); }
.ap-btn-ghost:hover { background: var(--brand-soft); }
.ap-btn-danger { background: var(--danger); color: var(--on-danger); }
.ap-btn-danger-quiet { background: transparent; color: var(--danger); border-color: var(--line-strong); }
.ap-btn .ap-btn-sub { font-weight: 400; font-size: 14px; opacity: .85; }

/* Search */
.ap-search { position: relative; display: flex; align-items: center; height: var(--target-lg); border-radius: var(--radius-md); background: var(--surface); border: 2px solid var(--line-strong); padding: 0 var(--space-3) 0 var(--space-4); gap: var(--space-3); color: var(--ink-muted); }
.ap-search:focus-within { border-color: var(--brand); }
.ap-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 18px; line-height: 30px; color: var(--ink); height: 100%; }
.ap-search input::placeholder { color: var(--ink-muted); }
.ap-search input:focus-visible { outline: none; }
.ap-search-scan { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 14px; color: var(--success); font-weight: 600; }

/* Category chips */
.ap-chips { display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-1) 0; scrollbar-width: none; }
.ap-chip { font: inherit; font-size: 16px; font-weight: 600; line-height: 24px; flex: none; min-height: var(--target-min); padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); }
.ap-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.ap-chip-count { font-size: 14px; font-weight: 400; opacity: .8; }
.ap-chip-hot { background: var(--accent-soft); border-color: var(--accent-edge); }

/* Badges & status */
.ap-badge { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 14px; line-height: 22px; font-weight: 600; padding: 0 var(--space-2); border-radius: var(--radius-sm); white-space: nowrap; }
.ap-badge-ok { background: var(--success-soft); color: var(--success); }
.ap-badge-warn { background: var(--warn-soft); color: var(--warn-text); }
.ap-badge-danger { background: var(--danger-soft); color: var(--danger); }
.ap-badge-accent { background: var(--accent-soft); color: var(--ink); }
.ap-badge-neutral { background: var(--surface-sunken); color: var(--ink-muted); }
.ap-pill { display: inline-flex; align-items: center; gap: var(--space-2); height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.ap-pill-dot { width: 10px; height: 10px; border-radius: var(--radius-pill); flex: none; }
.ap-pill-ok .ap-pill-dot { background: var(--success); }
.ap-pill-ok .ap-icon { color: var(--success); }
.ap-pill-warn { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }
.ap-pill-warn .ap-pill-dot { background: var(--warn); }
.ap-pill-warn .ap-icon { color: var(--warn-text); }
.ap-pill-error { background: var(--danger-soft); border-color: var(--danger); color: var(--ink); }
.ap-pill-error .ap-pill-dot { background: var(--danger); }
.ap-pill-error .ap-icon { color: var(--danger); }

/* Lang toggle */
.ap-lang { display: inline-flex; padding: 3px; border-radius: var(--radius-pill); background: var(--surface-sunken); border: 1px solid var(--line-strong); }
.ap-lang button { font: inherit; font-weight: 700; font-size: 15px; min-width: 52px; height: 42px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink-muted); cursor: pointer; }
.ap-lang button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }

/* Product card */
.ap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--space-3); }
.ap-card { font: inherit; text-align: left; position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 0; overflow: hidden; cursor: pointer; color: var(--ink); width: 100%; }
.ap-card:active { box-shadow: var(--shadow-raised); transform: translateY(1px); }
.ap-card[aria-disabled="true"] { cursor: not-allowed; }
.ap-card[aria-disabled="true"] .ap-card-img, .ap-card[aria-disabled="true"] .ap-card-price { opacity: .5; }
.ap-card-img { aspect-ratio: 4 / 3; background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; color: var(--ink-muted); overflow: hidden; }
.ap-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ap-card-body { padding: var(--space-2) var(--space-3) var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
.ap-card-name { font-size: 16px; line-height: 24px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 48px; }
.ap-card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; margin-top: auto; }
.ap-card-price { font-size: 20px; line-height: 28px; font-weight: 700; }
.ap-card-unit { font-size: 14px; color: var(--ink-muted); font-weight: 400; }
.ap-card-tag { position: absolute; top: var(--space-2); left: var(--space-2); }
.ap-card-qty { position: absolute; top: var(--space-2); right: var(--space-2); min-width: 32px; height: 32px; padding: 0 var(--space-2); border-radius: var(--radius-pill); background: var(--brand); color: var(--on-brand); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.ap-card-custom { border-style: dashed; border-color: var(--line-strong); background: transparent; align-items: center; justify-content: center; gap: var(--space-2); color: var(--brand); font-weight: 600; text-align: center; min-height: 200px; box-shadow: none; padding: var(--space-4); }

/* Stepper */
.ap-stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
.ap-step-btn { font: inherit; width: var(--target-min); height: var(--target-min); border: 0; background: transparent; color: var(--brand); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ap-step-btn[disabled] { color: var(--ink-muted); opacity: .5; cursor: not-allowed; }
.ap-step-val { min-width: 44px; text-align: center; font-size: 18px; font-weight: 700; border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: var(--target-min); }

/* Cart */
.ap-cart { width: var(--cart-width); max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
.ap-cart-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-4) var(--space-3); border-bottom: 1px solid var(--line); }
.ap-cart-head h2 { margin: 0; font-size: 22px; line-height: 32px; font-weight: 600; }
.ap-line { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
.ap-line[aria-selected="true"] { background: var(--brand-soft); }
.ap-line-name { font-size: 18px; line-height: 28px; font-weight: 600; }
.ap-line-meta { font-size: 14px; line-height: 22px; color: var(--ink-muted); }
.ap-line-disc { color: var(--warn-text); font-weight: 600; }
.ap-line-total { font-size: 20px; line-height: 28px; font-weight: 700; text-align: right; }
.ap-line-strike { font-size: 14px; color: var(--ink-muted); text-decoration: line-through; text-align: right; }
.ap-line-ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-2); }
.ap-line-ctrl .ap-spacer { flex: 1; }
.ap-sum { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); background: var(--surface); border-top: 1px solid var(--line); }
.ap-sum-row { display: flex; justify-content: space-between; font-size: 16px; color: var(--ink-muted); }
.ap-sum-row b { color: var(--ink); font-weight: 600; }
.ap-sum-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--space-2); border-top: 1px dashed var(--line-strong); }
.ap-sum-total span:first-child { font-size: 18px; font-weight: 600; }
.ap-sum-total span:last-child { font-size: 44px; line-height: 52px; font-weight: 700; letter-spacing: -.01em; }
.ap-sum-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.ap-empty { padding: var(--space-7) var(--space-5); text-align: center; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }

/* Payment */
.ap-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--space-2); }
.ap-seg button { font: inherit; font-size: 18px; font-weight: 600; min-height: var(--target-lg); border-radius: var(--radius-md); border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-3); }
.ap-seg button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.ap-notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.ap-note { font: inherit; min-height: var(--target-lg); border-radius: var(--radius-md); border: 1px solid var(--accent-edge); background: var(--accent-soft); color: var(--ink); font-size: 22px; font-weight: 700; cursor: pointer; }
.ap-note-exact { background: var(--surface); border-color: var(--line-strong); color: var(--brand); font-size: 18px; }
.ap-note:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ap-change { border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); display: flex; justify-content: space-between; align-items: center; background: var(--success-soft); color: var(--ink); }
.ap-change b { font-size: 36px; line-height: 44px; color: var(--success); }
.ap-change-short { background: var(--warn-soft); }
.ap-change-short b { color: var(--warn-text); }
.ap-recv { display: flex; justify-content: space-between; align-items: baseline; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-sunken); }
.ap-recv b { font-size: 36px; line-height: 44px; }

/* Table */
.ap-table-wrap { border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: auto; background: var(--surface); }
.ap-table { width: 100%; border-collapse: collapse; font-size: 16px; line-height: 24px; }
.ap-table th { position: sticky; top: 0; background: var(--surface-sunken); color: var(--ink-muted); font-size: 14px; font-weight: 600; text-align: left; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.ap-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); vertical-align: middle; }
.ap-table tr:last-child td { border-bottom: 0; }
.ap-table tbody tr:hover td { background: var(--brand-soft); }
.ap-table .ap-r { text-align: right; font-variant-numeric: tabular-nums; }
.ap-table-dense td { padding: var(--space-2) var(--space-4); }

/* Dialog */
.ap-scrim { background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
.ap-dialog { width: 440px; max-width: 100%; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-dialog); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
.ap-dialog-head { display: flex; gap: var(--space-3); align-items: flex-start; }
.ap-dialog-ico { width: 48px; height: 48px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--brand-soft); color: var(--brand); }
.ap-dialog-danger .ap-dialog-ico { background: var(--danger-soft); color: var(--danger); }
.ap-dialog-warn .ap-dialog-ico { background: var(--warn-soft); color: var(--warn-text); }
.ap-dialog h2 { margin: 0; font-size: 22px; line-height: 32px; font-weight: 600; }
.ap-dialog-body { font-size: 18px; line-height: 30px; color: var(--ink); }
.ap-dialog-actions { display: flex; gap: var(--space-2); justify-content: flex-end; }
.ap-dialog-actions .ap-btn { min-height: 56px; flex: 1; }

/* PIN pad */
.ap-pin { width: 336px; max-width: 100%; display: flex; flex-direction: column; gap: var(--space-4); align-items: center; }
.ap-pin-dots { display: flex; gap: var(--space-3); }
.ap-pin-dot { width: 18px; height: 18px; border-radius: var(--radius-pill); border: 2px solid var(--line-strong); }
.ap-pin-dot-on { background: var(--brand); border-color: var(--brand); }
.ap-pin-err .ap-pin-dot { border-color: var(--danger); }
.ap-pin-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); width: 100%; }
.ap-pin-key { font: inherit; height: var(--target-lg); border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 26px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ap-pin-key-quiet { border-color: transparent; background: transparent; color: var(--brand); font-size: 16px; }
.ap-pin-msg { font-size: 14px; line-height: 22px; min-height: 22px; color: var(--ink-muted); display: flex; gap: var(--space-1); align-items: center; }
.ap-pin-err .ap-pin-msg { color: var(--danger); font-weight: 600; }

/* Alerts & toasts */
.ap-alert { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1px solid; }
.ap-alert-body { flex: 1; font-size: 16px; line-height: 26px; }
.ap-alert-title { font-weight: 600; font-size: 18px; line-height: 28px; }

.cb-copies-in:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.cb-check { width: 22px; height: 22px; flex: none; accent-color: var(--brand); }
@media print {
  #print-root .cb-paper { width: 148mm; height: 210mm; box-shadow: none; }
  #print-root .cb-sheet-a5 { width: 148mm; height: 210mm; overflow: hidden; break-after: page; }
  #print-root .cb-a4 { width: 297mm; height: 210mm; overflow: hidden; break-after: page; }
  #print-root .cb-half { width: 148.5mm; }
}
@media (max-width: 1023px) {
  .cb-preview { width: auto; }
  .cb-row { grid-template-columns: 60px 64px minmax(0, 1fr) 84px 88px 48px; }
}

/* sign-in and loading */
.gate { align-items: center; justify-content: center; padding: var(--space-4); overflow: auto; }
.gate-box { width: 420px; max-width: 100%; padding: var(--space-6) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); box-shadow: var(--shadow-raised); }

/* receipt preview */
.rc-preview { background: var(--surface-sunken); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); overflow: auto; }
.no-logo .ap-receipt-logo { display: none; }

/* print: only the receipt */
@media print {
  @page { margin: 0; }
  html, body { height: auto; overflow: visible; background: #ffffff; }
  #root { display: none !important; }
  #print-root { display: block !important; }
  #print-root .ap-receipt { box-shadow: none; margin: 0; }
  #print-root .ap-receipt-58 { width: 58mm; box-sizing: border-box; }
  #print-root .ap-receipt-80 { width: 80mm; box-sizing: border-box; }
}

/* laptop and up: same layout, more room */
@media (min-width: 1600px) {
  .sell .ap-cart { width: 460px; }
}

/* below 1024px the cart becomes a bottom sheet */
@media (max-width: 1023px) {
  .ap-top { gap: var(--space-2); padding: 0 var(--space-2); }
  .ap-top .ap-logo { display: none; }
  .ap-top-status .ap-pill { display: none; }
  .ap-top-nav button { padding: 0 var(--space-2); }
  .sell { padding: var(--space-3); padding-bottom: 96px; }
  .pgrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .sell .ap-cart { position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: auto; max-height: 88vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; z-index: 40; box-shadow: var(--shadow-dialog); transform: translateY(105%); transition: transform .15s ease-out; }
  .sell .ap-cart.open { transform: none; }
  .cart-close { display: inline-flex; }
  .cart-mini { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow-raised); }
  .page { padding: var(--space-3); overflow: auto; }
  .split { flex-direction: column; min-height: auto; }
  .side { width: auto; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pay { flex-direction: column; padding: var(--space-3); }
  .pay-bill { width: auto; max-height: 40vh; }
  .settings-nav { width: auto !important; flex-direction: row !important; overflow-x: auto; }
}
@media (max-width: 600px) {
  .ap-top-nav button span, .ap-top-nav button { font-size: 14px; }
  .f-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .qr-box { width: auto; }
  .pay-due-v { font-size: 44px; line-height: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

<script>
/* Amornphan POS — cloud sync through Firebase (Firestore + email sign-in).
   Without window.FIREBASE_CONFIG the app stays local-only (data in this browser).
   Layout:  config/main                 settings, users
            shops/{shop}                prefix, cats, held, nextBill
            shops/{shop}/products/{id}  one product (stock changes are sent as increments)
            shops/{shop}/bills/{id}     one bill
            shops/{shop}/moves/{id}     one stock movement
            shops/{shop}/closes/{id}    one close-of-day record
   shops/{shop}/cashbills/{id} one hand-written A5 cash bill */
(function () {
  var cfg = window.FIREBASE_CONFIG;
  var SHOPS = ['stationery', 'parcel'];
  var BILL_DAYS = 120;
  var api = { enabled: !!(cfg && cfg.apiKey && window.firebase) };
  window.POSCloud = api;
  if (!api.enabled) return;

  firebase.initializeApp(cfg);
  var auth = firebase.auth(), fs = firebase.firestore();
  // one tab keeps the offline copy; a second tab still syncs, just without it. Sharing the copy across
  // tabs broke after a print window froze a tab ("failed to obtain primary lease"), so it stays per tab.
  try { fs.enablePersistence().catch(function () {}); } catch (e) { /* cache is optional */ }
  // a frozen page (print window, sleeping tablet) can leave the live connection stale: restart it on return
  function refresh() { fs.disableNetwork().then(function () { return fs.enableNetwork(); }).catch(function () {}); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });
  window.addEventListener('focus', refresh);
  window.addEventListener('online', refresh);
  window.addEventListener('afterprint', refresh);
  var inc = firebase.firestore.FieldValue.increment;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function clean(o) { return JSON.parse(JSON.stringify(o)); } // Firestore rejects undefined
  function billId(b) { return b.id || b.no; }

  api.onAuth = function (cb) { return auth.onAuthStateChanged(cb); };
  api.signIn = function (email, pw) { return auth.signInWithEmailAndPassword(email, pw); };
  api.signOut = function () { return auth.signOut(); };
  api.user = function () { return auth.currentUser; };

  /* ---------- reading: keep one cache per collection and rebuild the whole db on every change ---------- */
  api.subscribe = function (onData, onStatus, onError) {
    var cache = { config: undefined, shops: {} }, unsubs = [], pending = {};
    SHOPS.forEach(function (s) { cache.shops[s] = { meta: undefined, products: {}, bills: {}, moves: {}, closes: {}, cashbills: {} }; });

    function status(key, snap) {
      pending[key] = snap.metadata.hasPendingWrites;
      var n = 0; for (var k in pending) if (pending[k]) n++;
      onStatus(n > 0 ? 'pending' : snap.metadata.fromCache ? 'cache' : 'ok');
    }
    function emit() {
      if (cache.config === undefined) return;
      if (cache.config === null) { onData(null); return; } // nothing in the cloud yet
      for (var i = 0; i < SHOPS.length; i++) if (cache.shops[SHOPS[i]].meta === undefined) return;
      var out = { version: 2, settings: cache.config.settings, users: cache.config.users, shops: {} };
      SHOPS.forEach(function (s) {
        var c = cache.shops[s], m = c.meta || {};
        function vals(o) { return Object.keys(o).map(function (k) { return o[k]; }); }
        var products = vals(c.products).sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
        var bills = vals(c.bills).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        var maxNo = 0; bills.forEach(function (b) { var n = parseInt(String(b.no).split('-')[1], 10); if (n > maxNo) maxNo = n; });
        out.shops[s] = {
          prefix: m.prefix || (s === 'parcel' ? 'P' : 'A'), cats: m.cats || [], held: m.held || [],
          nextBill: Math.max(m.nextBill || 1, maxNo + 1), products: products, bills: bills,
          moves: vals(c.moves).sort(function (a, b) { return a.date < b.date ? -1 : 1; }),
          closes: vals(c.closes).sort(function (a, b) { return a.date < b.date ? -1 : 1; }),
          cashbills: vals(c.cashbills).sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : 1; })
        };
      });
      onData(out);
    }
    function listen(key, ref, apply) {
      unsubs.push(ref.onSnapshot({ includeMetadataChanges: true }, function (snap) { apply(snap); status(key, snap); emit(); }, onError));
    }
    function coll(key, ref, target) {
      listen(key, ref, function (snap) {
        snap.docChanges().forEach(function (ch) {
          if (ch.type === 'removed') delete target[ch.doc.id];
          else target[ch.doc.id] = ch.doc.data();
        });
      });
    }

    listen('config', fs.doc('config/main'), function (snap) { cache.config = snap.exists ? snap.data() : null; });
    var since = new Date(Date.now() - BILL_DAYS * 864e5).toISOString();
    SHOPS.forEach(function (s) {
      var c = cache.shops[s], base = fs.collection('shops').doc(s);
      listen('meta-' + s, base, function (snap) { c.meta = snap.exists ? snap.data() : null; });
      coll('products-' + s, base.collection('products'), c.products);
      coll('bills-' + s, base.collection('bills').where('date', '>=', since), c.bills);
      coll('moves-' + s, base.collection('moves').orderBy('date', 'desc').limit(400), c.moves);
      coll('closes-' + s, base.collection('closes').orderBy('date', 'desc').limit(120), c.closes);
      coll('cashbills-' + s, base.collection('cashbills').orderBy('createdAt', 'desc').limit(300), c.cashbills);
    });
    return function () { unsubs.forEach(function (u) { u(); }); };
  };

  /* ---------- writing: send only what changed between two versions of the db ---------- */
  function Writer() { this.ops = []; }
  Writer.prototype.set = function (ref, data, merge) { this.ops.push(['set', ref, clean(data), merge]); };
  Writer.prototype.update = function (ref, data) { this.ops.push(['update', ref, data]); };
  Writer.prototype.del = function (ref) { this.ops.push(['delete', ref]); };
  Writer.prototype.commit = function () {
    var chunks = [], ops = this.ops;
    for (var i = 0; i < ops.length; i += 450) chunks.push(ops.slice(i, i + 450));
    return Promise.all(chunks.map(function (part) {
      var b = fs.batch();
      part.forEach(function (o) {
        if (o[0] === 'set') b.set(o[1], o[2], o[3] ? { merge: true } : {});
        else if (o[0] === 'update') b.update(o[1], o[2]);
        else b.delete(o[1]);
      });
      return b.commit();
    }));
  };

  function byKey(list, key) { var m = {}; (list || []).forEach(function (x) { m[key(x)] = x; }); return m; }

  function diffShop(w, s, a, b) {
    var base = fs.collection('shops').doc(s);
    var metaA = a ? { prefix: a.prefix, cats: a.cats, held: a.held, nextBill: a.nextBill } : null;
    var metaB = { prefix: b.prefix, cats: b.cats, held: b.held, nextBill: b.nextBill };
    if (!same(metaA, metaB)) w.set(base, metaB);

    var pa = byKey(a && a.products, function (p) { return p.id; }), pb = byKey(b.products, function (p) { return p.id; });
    Object.keys(pb).forEach(function (id, i) {
      var nb = pb[id], na = pa[id], ref = base.collection('products').doc(id);
      // a product added in the app goes to the top of the list, like it does locally
      if (!na) { w.set(ref, Object.assign({ ord: nb.ord != null ? nb.ord : (a ? -Math.round(Date.now() / 1000) : i) }, nb)); return; }
      if (same(na, nb)) return;
      var restA = Object.assign({}, na), restB = Object.assign({}, nb);
      delete restA.stock; delete restB.stock;
      if (!same(restA, restB)) w.set(ref, restB, true);
      if (na.stock !== nb.stock) {
        // two devices selling the same item while apart must both count, so stock moves by a delta
        if (typeof na.stock === 'number' && typeof nb.stock === 'number') w.update(ref, { stock: inc(nb.stock - na.stock) });
        else w.set(ref, { stock: nb.stock == null ? null : nb.stock }, true);
      }
    });
    Object.keys(pa).forEach(function (id) { if (!pb[id]) w.del(base.collection('products').doc(id)); });

    function byId(x) { return x.id; }
    [['bills', billId], ['moves', byId], ['closes', byId], ['cashbills', byId]].forEach(function (spec) {
      var name = spec[0], key = spec[1];
      var ma = byKey(a && a[name], key), mb = byKey(b[name], key);
      Object.keys(mb).forEach(function (k) { if (!ma[k] || !same(ma[k], mb[k])) w.set(base.collection(name).doc(k), mb[k]); });
      Object.keys(ma).forEach(function (k) { if (!mb[k]) w.del(base.collection(name).doc(k)); });
    });
  }

  api.push = function (prev, next) {
    var w = new Writer();
    if (!prev || !same({ s: prev.settings, u: prev.users }, { s: next.settings, u: next.users })) w.set(fs.doc('config/main'), { version: 2, settings: next.settings, users: next.users });
    SHOPS.forEach(function (s) { if (next.shops[s]) diffShop(w, s, prev && prev.shops[s], next.shops[s]); });
    if (!w.ops.length) return Promise.resolve();
    return w.commit();
  };

  // first device to sign in: give every record an id and send the whole db up
  api.prepare = function (full) {
    var d = clean(full);
    SHOPS.forEach(function (s) {
      var sh = d.shops[s]; if (!sh) return;
      sh.products.forEach(function (p, i) { if (p.ord == null) p.ord = i; });
      sh.moves.forEach(function (m) { if (!m.id) m.id = uid(); });
      (sh.closes || []).forEach(function (c) { if (!c.id) c.id = uid(); });
      var since = new Date(Date.now() - BILL_DAYS * 864e5).toISOString();
      sh.bills = sh.bills.filter(function (b) { return b.date >= since; });
      sh.moves = sh.moves.slice(-400);
    });
    return d;
  };
  api.upload = function (full) { return api.push(null, full); };
})();

</script>

<script>
/* Amornphan POS — the app. React 18 without a build step; components from window.Amornphan. */
(function () {
  'use strict';
  var React = window.React, ReactDOM = window.ReactDOM, A = window.Amornphan, D = window.POSData;
  var h = React.createElement, Frag = React.Fragment;
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useMemo = React.useMemo, useCallback = React.useCallback;
  var baht = A.formatBaht;

  /* ---------- storage ---------- */

  function load(key) { try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function store(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function clone(o) { return typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)); }

  /* ---------- small helpers ---------- */
  function fill(s, v) { return String(s).replace(/\{(\w)\}/g, function (_, k) { return v && v[k] != null ? v[k] : ''; }); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function hhmm(d) { d = new Date(d); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function isTyping(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT'); }
  function num(v) { var n = parseFloat(String(v).replace(/[^\d.\-]/g, '')); return isNaN(n) ? 0 : n; }
  var audioCtx = null;
  function tick() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 1320; g.gain.value = 0.06; o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.045);
    } catch (e) { /* sound is optional */ }
  }
  function download(name, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ---------- domain helpers ---------- */
  function findProduct(db, id) { for (var i = 0; i < db.products.length; i++) if (db.products[i].id === id) return db.products[i]; return null; }
  function findByBarcode(db, code) {
    code = String(code).trim(); if (!code) return null;
    for (var i = 0; i < db.products.length; i++) {
      var p = db.products[i];
      for (var j = 0; j < p.units.length; j++) if (p.units[j].barcode === code) return { p: p, unit: j };
      if (p.sku.toLowerCase() === code.toLowerCase()) return { p: p, unit: 0 };
    }
    return null;
  }
  function lineView(db, l, lang) {
    if (l.custom) return { name: l.custom.name || '—', price: l.custom.price, unitName: '', units: null, factor: 1, cost: 0, max: undefined, pid: null };
    var p = findProduct(db, l.pid); if (!p) return { name: '?', price: 0, unitName: '', factor: 1, cost: 0 };
    var u = p.units[l.unit] || p.units[0];
    return { name: p.name[lang] || p.name.th, price: u.price, unitName: u[lang] || u.th, units: p.units.length > 1 ? p.units.map(function (x) { return x[lang] || x.th; }) : null, factor: u.factor, cost: p.cost * u.factor, p: p, pid: p.id };
  }
  function baseInCart(db, cart, pid, exceptKey) {
    var n = 0;
    cart.lines.forEach(function (l) { if (l.pid === pid && l.key !== exceptKey) { var p = findProduct(db, pid); n += l.qty * ((p && p.units[l.unit]) ? p.units[l.unit].factor : 1); } });
    return n;
  }
  function lineMax(db, cart, l) {
    if (l.custom) return undefined;
    var p = findProduct(db, l.pid); if (!p || p.stock == null) return undefined;
    var f = (p.units[l.unit] || p.units[0]).factor;
    return Math.max(0, Math.floor((p.stock - baseInCart(db, cart, l.pid, l.key)) / f));
  }
  function cartTotals(db, cart, lang) {
    var sub = 0, pcs = 0;
    cart.lines.forEach(function (l) { var v = lineView(db, l, lang); sub += v.price * l.qty - (l.discount || 0); pcs += l.qty; });
    var disc = Math.min(cart.discount || 0, sub);
    return { subtotal: round2(sub), discount: round2(disc), total: round2(sub - disc), pcs: pcs, lines: cart.lines.length };
  }
  function billNo(n, prefix) { return (prefix || 'A') + '-' + String(n).padStart(4, '0'); }
  function matchProduct(pr, s) {
    return pr.name.th.toLowerCase().indexOf(s) >= 0 || pr.name.en.toLowerCase().indexOf(s) >= 0 || pr.sku.toLowerCase().indexOf(s) >= 0 ||
      (pr.code && pr.code.toLowerCase() === s) || pr.units.some(function (u) { return u.barcode && u.barcode.indexOf(s) === 0; });
  }
  function findByCode(db, s) { s = String(s).trim().toLowerCase(); if (!s) return null; for (var i = 0; i < db.products.length; i++) if (db.products[i].code && db.products[i].code.toLowerCase() === s) return db.products[i]; return null; }
  function billPcs(b) { return b.lines.reduce(function (a, l) { return a + l.qty; }, 0); }
  function billCost(b) { return b.lines.reduce(function (a, l) { return a + (l.cost || 0) * l.qty; }, 0); }
  function emptyCart() { return { lines: [], discount: 0, actions: 0 }; }

  /* ---------- receipt from a bill ---------- */
  function ReceiptOf(p) {
    var b = p.bill, db = p.db, s = db.settings, lang = p.lang || s.receiptLang;
    var items = b.lines.map(function (l) {
      var nm = (l.name[lang] || l.name.th) + (l.factor > 1 ? ' (' + (l.unitName[lang] || l.unitName.th) + ')' : '');
      return { name: nm, price: l.price, qty: l.qty, discount: l.discount || 0 };
    });
    var user = db.users.filter(function (u) { return u.id === b.cashier; })[0];
    return h('div', { className: s.showLogo ? '' : 'no-logo' }, h(A.Receipt, {
      width: p.width || s.paper, lang: lang, items: items, discount: b.discount, received: b.method === 'cash' ? b.received : b.total, method: b.method,
      billNo: b.no, date: b.date, cashier: user ? user[lang] : '', footer: lang === 'en' ? s.footerEn : s.footer,
      shop: { name: s.shop.name + (db.shop === 'parcel' ? ' · ร้านพัสดุ' : ''), nameEn: s.shop.nameEn + (db.shop === 'parcel' ? ' · Parcel shop' : ''), address: lang === 'en' ? s.shop.addressEn : s.shop.address, phone: s.shop.phone }
    }));
  }

  /* ---------- generic UI pieces ---------- */
  function Field(p) {
    return h('div', { className: 'f' + (p.full ? ' full' : '') },
      h('label', { className: 'f-label', htmlFor: p.id }, p.label),
      p.children || h('input', Object.assign({ id: p.id, className: 'f-input' + (p.num ? ' ap-num' : ''), value: p.value, onChange: function (e) { p.onChange(e.target.value); } }, p.input || {})));
  }
  function Switch(p) {
    return h('button', { type: 'button', role: 'switch', className: 'sw', 'aria-checked': !!p.value, 'aria-label': p.label, onClick: function () { p.onChange(!p.value); } }, h('span', { className: 'sw-k' }));
  }
  function Seg(p) {
    return h('div', { className: 'ap-seg', style: p.style, role: 'group', 'aria-label': p.label },
      p.options.map(function (o) {
        return h('button', { key: o[0], type: 'button', 'aria-pressed': p.value === o[0], onClick: function () { p.onChange(o[0]); }, style: { minHeight: 48, fontSize: 16 } }, o[2] ? h(A.Icon, { name: o[2], size: 20 }) : null, o[1]);
      }));
  }
  function SearchBox(p) {
    return h('label', { className: 'ap-search', style: { height: 48, width: p.width || 340, flex: 'none', borderWidth: 1, maxWidth: '100%' } },
      h(A.Icon, { name: 'search' }),
      h('input', { type: 'search', placeholder: p.placeholder, 'aria-label': p.placeholder, value: p.value, onChange: function (e) { p.onChange(e.target.value); }, style: { fontSize: 16 }, onKeyDown: p.onKeyDown }));
  }

  /* ======================================================================
     SELL
     ====================================================================== */
  function SellView(p) {
    var db = p.db, lang = p.lang, tx = p.tx, cart = p.cart;
    var q = p.query, cat = p.cat;
    var cats = [{ id: 'hot', label: tx('hot'), icon: 'star', hot: true }, { id: 'all', label: tx('all') }].concat(db.cats.map(function (c) { return { id: c.id, label: c[lang] }; }));
    var list = useMemo(function () {
      var s = q.trim().toLowerCase();
      return db.products.filter(function (pr) {
        if (s) return matchProduct(pr, s);
        if (cat === 'hot') return pr.best;
        if (cat === 'all') return true;
        return pr.cat === cat;
      });
    }, [db.products, q, cat]);
    var inCart = {};
    cart.lines.forEach(function (l) { if (l.pid) inCart[l.pid] = (inCart[l.pid] || 0) + l.qty; });
    var tot = cartTotals(db, cart, lang);

    function onSearchKey(e) {
      var v = e.target.value;
      if (e.key === 'Enter') {
        e.preventDefault();
        var hit = findByBarcode(db, v);
        if (hit) { p.addProduct(hit.p, hit.unit, true); p.setQuery(''); return; }
        var byCode = findByCode(db, v);
        if (byCode) { p.addProduct(byCode, 0); p.setQuery(''); return; }
        if (/^\d{6,}$/.test(v.trim())) { p.toast(fill(tx('notFound'), { x: v.trim() }), 'warn'); p.setQuery(''); return; }
        if (list.length === 1) { p.addProduct(list[0], 0); p.setQuery(''); }
        return;
      }
      if (!v && (e.key === '+' || e.key === '-' || e.key === 'Delete')) { e.preventDefault(); p.keyLine(e.key); }
